<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cash Payment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
    @media (max-width: 767.98px) {
    body, h1, h2, h3, h4, h5, h6, p, strong, span, button, a {
      font-size: 90% !important;
    }

    h4 {
      font-size: 16px !important;
    }

    p {
      font-size: 14px !important;
    }

    .btn {
      font-size: 14px !important;
      padding: 8px 16px !important;
    }

    #countdown {
      font-size: 14px !important;
    }
  }
  </style>
  <script>
    let timeLeft = 30;
    function startCountdown() {
      const timerDisplay = document.getElementById("countdown");
      const countdownInterval = setInterval(() => {
        if (timeLeft <= 0) {
          clearInterval(countdownInterval);
          window.location.href = "https://1croreprojects.com/";
        } else {
          timerDisplay.textContent = timeLeft + " second(s)";
          timeLeft--;
        }
      }, 1000);
    }
    window.onload = startCountdown;
  </script>
</head>
<body>
  <div class="container mt-5">
    <div class="alert alert-success text-center" id="thankYouMsg">
      <h4>Thank you for submitting your true details.</h4>
      <p><strong>Bill No: {{ bill_no }}</strong></p>
      <p><strong>Team:</strong> {{ registration.team_id }}</p>
      <p>Please take a screenshot of this page for future reference.</p>
      <p class="mt-3 text-danger fw-bold">Redirecting in <span id="countdown">30 second(s)</span>...</p>
    </div>

    <div class="text-center mt-4">
      <a href="https://1croreprojects.com/" class="btn btn-secondary">Go to Home Now</a>
    </div>
  </div>
</body>
</html>
