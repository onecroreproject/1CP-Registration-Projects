{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
</head>
<body>
<div class="container mt-5">
  <div class="card p-4">
    <h2 class="text-center text-success">Payment Details</h2>
    <table class="table table-bordered">
      <tr><th>Name</th><td>{{ registration.name }}</td></tr>
      <tr><th>Email</th><td>{{ registration.email }}</td></tr>
      <tr><th>Phone</th><td>{{ registration.contact }}</td></tr>
      <tr><th>Amount</th><td>₹{{ payment.amount|floatformat:2 }}</td></tr>
    </table>
    <button id="payButton" class="btn btn-success w-100">Pay with Cashfree</button>
  </div>
</div>

<script>
const cashfree = Cashfree({ mode: "sandbox" });

$('#payButton').click(function() {
    const csrftoken = '{{ csrf_token }}';
    $.ajax({
        url: "{% url 'internship:create_order_ajax' %}",
        method: "POST",
        data: { payment_id: '{{ payment.id }}' },
        headers: { "X-CSRFToken": csrftoken },
        success: function(response) {
            if(response.status === "success") {
                cashfree.checkout({
                    paymentSessionId: response.payment_session_id,
                    orderId: response.orderId,
                    redirectTarget: "_self"
                });
            } else {
                alert("Error creating order: " + response.message);
            }
        },
        error: function() {
            alert("Failed to create order. Try again!");
        }
    });
});
</script>
</body>
</html>
