    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <div class="card w-100" style="max-width: 500px;">

    <!-- Bootstrap 5 JS (optional, for components like modal) -->
