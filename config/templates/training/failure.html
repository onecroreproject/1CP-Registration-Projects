<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Failed</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">
                <div class="border border-danger rounded-3 bg-danger-subtle p-4 shadow-sm text-center">
                    <h1 class="h3 text-danger mb-3">Payment Failed</h1>
                    <p class="mb-2">Dear <strong>{{ payment.name }}</strong>, your payment attempt was not successful.</p>
                    <p class="mb-4">Please try again or contact support.</p>
                    <a href="{% url 'home' %}" class="btn btn-outline-danger">Back to Home</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS (optional, for components) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
